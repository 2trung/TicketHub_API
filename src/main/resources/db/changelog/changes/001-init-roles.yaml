databaseChangeLog:
  - changeSet:
      id: 001-init-roles
      author: system
      changes:
        - insert:
            tableName: role
            columns:
              - column:
                  name: name
                  value: ADMIN
              - column:
                  name: description
                  value: Administrator role with full system access
        - insert:
            tableName: role
            columns:
              - column:
                  name: name
                  value: USER
              - column:
                  name: description
                  value: Standard user role with basic access

